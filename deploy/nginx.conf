# Replace financeiro.example.com and certificate paths before enabling.
server {
    listen 80;
    server_name financeiro.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name financeiro.example.com;
    ssl_certificate /etc/letsencrypt/live/financeiro.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/financeiro.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    root /opt/meu-financeiro/current/frontend/dist;
    location / { try_files $uri $uri/ /index.html; }
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
